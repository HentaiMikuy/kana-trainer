name: Android release

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_REPOSITORY: ${{ github.repository }}

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-app
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package is no longer distributed by Google.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify public release repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from publish_release import GitHub
          api = GitHub(os.environ['GH_TOKEN'], os.environ['RELEASE_REPOSITORY'])
          if api.request('/')['private']:
              raise SystemExit('This repository must be public for anonymous app updates. See RELEASE.md.')
          PY
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Run unit tests
        run: |
          bash ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
          python3 -m unittest discover -s tools/tests -v
      - name: Load production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for key in ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'):
              if not os.environ.get(key):
                  raise SystemExit('Missing production signing secrets. See android-app/RELEASE.md.')
          path = Path(os.environ['RUNNER_TEMP']) / 'kana-release.jks'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PY
      - name: Build signed production APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version_code=$((10000 + $(git rev-list --count HEAD)))
          bash ./gradlew :app:assembleRelease --no-daemon --console=plain \
            -PciVersionCode="$version_code" -PupdateRepository="$RELEASE_REPOSITORY"
      - name: Verify APK and prepare update assets
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          min_sdk=$(apkanalyzer manifest min-sdk "$apk")
          mkdir -p app/build/release-assets
          python3 tools/prepare_release.py --apk "$apk" \
            --metadata app/build/outputs/apk/release/output-metadata.json \
            --repository "$RELEASE_REPOSITORY" --min-sdk "$min_sdk" \
            --notes release-notes.md --output app/build/release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_DIR: app/build/release-assets
        run: python3 tools/publish_release.py
      - name: Remove signing file
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'kana-release.jks').unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android-app/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
